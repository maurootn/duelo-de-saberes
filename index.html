<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14122b">
<title>Duelo de Saberes</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #f4f1ff;
    background: radial-gradient(circle at 50% 30%, #2d2670 0%, #14122b 70%);
    text-align: center;
  }
  main { max-width: 560px; }
  .selo {
    display: inline-block; padding: 6px 14px; border-radius: 999px;
    background: #ffc93c; color: #14122b;
    font-size: 0.8rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  }
  h1 { margin: 20px 0 12px; font-size: clamp(2.2rem, 9vw, 4rem); line-height: 1.05; }
  h1 span { color: #ffc93c; }
  p { font-size: clamp(1rem, 3.5vw, 1.2rem); line-height: 1.5; opacity: 0.85; }
  .ok {
    margin-top: 28px; padding: 14px 18px; border-radius: 14px;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18);
    font-size: 0.95rem;
  }
  footer { margin-top: 28px; font-size: 0.8rem; opacity: 0.6; }
</style>
</head>
<body>
<main>
  <span class="selo">Versão 2.0 em construção</span>
  <h1>Duelo de <span>Saberes</span></h1>
  <p>Jogo de perguntas por equipes para a sala de aula.</p>
  <div class="ok">✅ Publicação funcionando: se você está vendo esta página, o endereço do app está no ar.</div>
  <footer>Prof. Mauro Vinícius · Tanque Novo-BA</footer>
</main>
</body>
</html>
